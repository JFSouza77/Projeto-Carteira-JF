# Carteira JF · servidor (Cloudflare Worker, plano grátis)
# Como publicar: servidor/LEIA-ME.md
name = "carteira-jf"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Lembretes: confere a cada 15 minutos quem marcou lembrete para agora
[triggers]
crons = ["*/15 * * * *"]

# Banco chave-valor (inscrições de lembrete e contador de uso da IA).
# Crie com: npx wrangler kv namespace create CARTEIRA_KV  e cole o id aqui.
[[kv_namespaces]]
binding = "CARTEIRA_KV"
id = "379949e5fbdc44f2bc3a99f8f8ce65cb" # criado com o JF em 14/11 (o id não é segredo: só funciona dentro da conta dele)

[vars]
# Endereço(s) onde o app está publicado, separados por vírgula (ex.: https://carteira-jf.pages.dev)
ORIGENS = "https://carteira-jf.pages.dev"
# Modelo da IA. Padrão: claude-opus-5-5. Mais barato: claude-haiku-5-5.
IA_MODELO = "claude-opus-5-5"
# Limites de uso da IA (protegem a conta de custo surpresa)
IA_LIMITE_DIA = "40"
IA_TETO_DIA = "300"
# Notícias do dia (14/11): a IA busca 2x por dia (7h e 17h de Brasília). "1" liga, "0" desliga.
# Modelo barato pra caber no crédito; no máximo 2 buscas por vez (US$ 0,01 cada) e um teto de rodadas por mês.
NOTICIAS_LIGADAS = "1"
NOTICIAS_MODELO = "claude-haiku-5-5"
NOTICIAS_TETO_MES = "62"
# Chave PÚBLICA dos lembretes (gerada por: node ferramentas/gerar_vapid.js). A privada vai em segredo.
VAPID_PUBLIC_KEY = ""
# Selo de criador (12/11): apelido(s) da conta do criador, separados por vírgula. Só com a senha certa vale.
CRIADOR_CONTAS = "jf"
# Contato exigido pelos serviços de push (pode ser um e-mail seu ou o site do app)
VAPID_CONTATO = "mailto:troque@exemplo.com"

# Segredos (NUNCA aqui; use: npx wrangler secret put NOME):
#   ANTHROPIC_API_KEY   chave da API da Anthropic
#   VAPID_PRIVATE_JWK   chave privada dos lembretes (saída do gerar_vapid.js)
